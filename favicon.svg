<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B61FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E6F0FF;stop-opacity:0.9" />
    </linearGradient>
  </defs>

  <!-- Background with gradient -->
  <rect width="100" height="100" rx="20" fill="url(#bgGradient)"/>

  <!-- Network/connection icon - three overlapping circles representing people connecting -->
  <!-- Left person circle -->
  <circle cx="32" cy="50" r="14" fill="none" stroke="url(#iconGradient)" stroke-width="3.5"/>
  <circle cx="32" cy="50" r="6" fill="url(#iconGradient)"/>

  <!-- Right person circle -->
  <circle cx="68" cy="50" r="14" fill="none" stroke="url(#iconGradient)" stroke-width="3.5"/>
  <circle cx="68" cy="50" r="6" fill="url(#iconGradient)"/>

  <!-- Connection line with arrow -->
  <path d="M 46 50 L 54 50" stroke="url(#iconGradient)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 54 50 L 48 45" stroke="url(#iconGradient)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 54 50 L 48 55" stroke="url(#iconGradient)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Sparkle/star accent for AI magic -->
  <circle cx="50" cy="28" r="2.5" fill="#FFFFFF" opacity="0.9"/>
  <path d="M 50 22 L 50 34" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M 44 28 L 56 28" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
</svg>
